name: AI review debate

# Reacciona cuando CodeRabbit comenta en un PR: lee .github/review-protocol.md
# y decide si responde, arregla el codigo, o escala a Francisco por Slack.
# No corre en respuesta a comentarios de humanos ni a sus propios comentarios
# anteriores (ver "allowed_bots" mas abajo).
#
# El segundo revisor es un modelo elegido vía OpenRouter (hoy:
# openai/gpt-5.3-codex, ver MODEL abajo) -- no depende de la infraestructura
# de ningún proveedor puntual, así que cambiar de modelo es una sola línea
# (.github/scripts/model-review-agent.mjs implementa el loop de tool-calling
# a mano, no usa el SDK/action de ningún proveedor).
#
# Seguridad (repo publico -> cualquiera puede abrir un PR desde un fork):
# el job "respond" corre con contents:write, la API key de OpenRouter, y
# capacidad de editar archivos y hacer push -- si reaccionara a un PR de un
# fork, leeria el diff de ese PR (texto controlado por quien lo abrio) con
# permisos reales de escritura sobre este repo. Por eso "resolve-pr" corre
# primero, sin secretos ni permisos de escritura, y "respond" solo se
# dispara si resolve-pr confirma que el PR es del mismo repo (no un fork).
# Si es de un fork, "respond" nunca corre -- CodeRabbit igual lo revisa por
# su cuenta, sin depender de nuestros secrets. Hallazgo real de CodeRabbit
# en el PR #4.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Disparo manual: para releer el estado real de un PR y mandar un Slack
  # actualizado bajo demanda -- típicamente después de que un humano aplicó
  # un fix fuera del loop del agente (ej. algo ESCALADO por requerir push a
  # .github/), donde de otra forma el Slack quedaría desactualizado hasta
  # que CodeRabbit comente de nuevo por casualidad. Solo lo puede disparar
  # alguien con acceso de escritura al repo (restricción propia de GitHub
  # para workflow_dispatch, nada que agreguemos nosotros).
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Numero del PR a releer"
        required: true
        type: number

concurrency:
  group: ai-review-${{ github.event.inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  resolve-pr:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'coderabbitai[bot]') ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == 'coderabbitai[bot]') ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      is_fork: ${{ steps.check.outputs.is_fork }}
      head_ref: ${{ steps.check.outputs.head_ref }}
    steps:
      - name: Determinar si el PR es de un fork
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}"
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName,isCrossRepository)
          echo "is_fork=$(echo "$PR_JSON" | jq -r .isCrossRepository)" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$PR_JSON" | jq -r .headRefName)" >> "$GITHUB_OUTPUT"

  respond:
    needs: resolve-pr
    # Ojo: un "if" propio en un job con "needs" reemplaza el chequeo
    # implicito de que el job anterior haya tenido exito -- hay que
    # verificarlo a mano con needs.resolve-pr.result.
    if: >
      needs.resolve-pr.result == 'success' &&
      needs.resolve-pr.outputs.is_fork == 'false'
    runs-on: ubuntu-latest
    # El GITHUB_TOKEN default ya no se usa para nada privilegiado en este
    # job -- todo lo que escribe (checkout, gh, git push) usa el token de
    # instalacion de la App generado abajo. Se deja en read-only.
    permissions:
      contents: read
    steps:
      # Token de instalacion de la GitHub App "AI Second Reviewer" en vez
      # del token default de Actions -- asi los comentarios/commits del
      # segundo revisor aparecen con identidad propia
      # (ai-second-reviewer[bot]) en vez de "github-actions[bot]" generico.
      # Los permisos reales de este token estan acotados por los permisos
      # configurados en la propia App (Contents/Issues/Pull requests:
      # read & write, nada de Workflows) -- ver github.com/settings/apps.
      - name: Generar token de la App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AI_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AI_REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: itacen-control-stock

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-pr.outputs.head_ref }}
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias (para que la tool run_build funcione)
        run: npm ci

      # No le pasamos SLACK_WEBHOOK_URL a este paso: el modelo nunca ve el
      # secret. Si decide notificar, solo escribe un archivo de texto en
      # /tmp (fuera del repo) -- el paso siguiente, que SI corre con el
      # secret, es el unico que llega a mandar algo a Slack.
      #
      # GH_TOKEN es necesario para que "gh" funcione dentro de las
      # herramientas del agente (leer/comentar el PR). Necesitamos
      # comentarios nuevos (no ediciones) para que CodeRabbit efectivamente
      # reaccione de nuevo -- una edición no dispara su bot.
      - name: Segundo revisor (OpenRouter)
        # Tope de duración/costo: el script ya corta solo a los 40
        # tool-calls (ver MAX_ITERATIONS en model-review-agent.mjs), pero
        # esto es una red de seguridad extra a nivel del step -- sin esto,
        # el timeout por defecto del job es 360 minutos.
        timeout-minutes: 20
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          MODEL: openai/gpt-5.3-codex
          MANUAL_RESYNC: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: node .github/scripts/model-review-agent.mjs

      - name: Notificar a Slack si corresponde
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -f /tmp/slack-notify.txt ]; then
            bash .github/scripts/notify-slack.sh "$(cat /tmp/slack-notify.txt)"
            rm -f /tmp/slack-notify.txt
          fi
