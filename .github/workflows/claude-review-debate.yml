name: Claude review debate

# Reacciona cuando CodeRabbit comenta en un PR: lee .github/review-protocol.md
# y decide si responde, arregla el codigo, o escala a Francisco por Slack.
# No corre en respuesta a comentarios de humanos ni a sus propios comentarios
# anteriores (ver "allowed_bots" mas abajo).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    if: >
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'coderabbitai[bot]') ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == 'coderabbitai[bot]') ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Para eventos issue_comment, actions/checkout sin "ref" trae el
      # branch por defecto del repo (main), no el branch real del PR --
      # rompe cualquier intento de Claude de commitear/pushear un fix
      # directo (Paso 4 del protocolo). Resolvemos el head ref real del PR
      # primero, para los 3 tipos de evento que dispara este workflow.
      #
      # OJO seguridad: este repo es público, cualquiera puede abrir un PR
      # desde un fork. Este job corre con contents:write y el token de
      # Claude -- si trajéramos el branch de un fork, Claude leería y
      # actuaría sobre .github/review-protocol.md (y cualquier otro
      # archivo) controlado por quien abrió el PR, con permisos de
      # escritura reales sobre este repo (hallazgo real de CodeRabbit en
      # el PR #4). Por eso SOLO confiamos el ref real cuando el PR es del
      # mismo repo (isCrossRepository=false, ej. staging -> main); si es
      # de un fork externo, seguimos trayendo siempre el branch por
      # defecto (de confianza) y Claude solo puede comentar, nunca
      # pushear -- eso es intencional, no un bug.
      - name: Resolver branch real del PR (solo si no es de un fork)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName,isCrossRepository)
          IS_FORK=$(echo "$PR_JSON" | jq -r .isCrossRepository)
          if [ "$IS_FORK" = "true" ]; then
            echo "PR de un fork externo -- no confiamos su branch, se mantiene el checkout del branch por defecto." >&2
            echo "ref=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(echo "$PR_JSON" | jq -r .headRefName)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 1

      # No le pasamos SLACK_WEBHOOK_URL a este paso: Claude nunca ve el
      # secret. Si decide notificar, solo escribe un archivo de texto en
      # /tmp (fuera del repo) -- el paso siguiente, que SI corre con el
      # secret, es el unico que llega a mandar algo a Slack.
      - uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1
        env:
          # Necesario para que "gh pr comment" funcione dentro del Bash del
          # agente. El comment-server interno de la action solo sirve para
          # EDITAR un comentario propio ya existente, no para postear un
          # comentario nuevo -- y necesitamos comentarios nuevos para que
          # CodeRabbit efectivamente reaccione de nuevo (una edicion no
          # dispara su bot).
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "coderabbitai[bot]"
          prompt: |
            Lee el archivo .github/review-protocol.md de este repo y seguí
            esas reglas al pie de la letra para decidir como responder al
            comentario de CodeRabbit que disparo esta ejecucion, en el PR
            #${{ github.event.pull_request.number || github.event.issue.number }}
            del repositorio ${{ github.repository }}. Usá "gh pr comment" para
            postear tu respuesta como comentario nuevo en el PR (nunca uses
            ninguna otra herramienta de comentarios).
          claude_args: |
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(npm run build:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*)"

      - name: Notificar a Slack si corresponde
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -f /tmp/slack-notify.txt ]; then
            bash .github/scripts/notify-slack.sh "$(cat /tmp/slack-notify.txt)"
            rm -f /tmp/slack-notify.txt
          fi
