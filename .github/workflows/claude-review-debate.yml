name: Claude review debate

# Reacciona cuando CodeRabbit comenta en un PR: lee .github/review-protocol.md
# y decide si responde, arregla el codigo, o escala a Francisco por Slack.
# No corre en respuesta a comentarios de humanos ni a sus propios comentarios
# anteriores (ver "allowed_bots" mas abajo).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    if: >
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'coderabbitai[bot]') ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == 'coderabbitai[bot]') ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      # No le pasamos SLACK_WEBHOOK_URL a este paso: Claude nunca ve el
      # secret. Si decide notificar, solo escribe un archivo de texto en
      # /tmp (fuera del repo) -- el paso siguiente, que SI corre con el
      # secret, es el unico que llega a mandar algo a Slack.
      - uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "coderabbitai[bot]"
          prompt: |
            Lee el archivo .github/review-protocol.md de este repo y seguí
            esas reglas al pie de la letra para decidir como responder al
            comentario de CodeRabbit que disparo esta ejecucion, en el PR
            #${{ github.event.pull_request.number || github.event.issue.number }}
            del repositorio ${{ github.repository }}.
          claude_args: |
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(npm run build:*)"

      - name: Notificar a Slack si corresponde
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -f /tmp/slack-notify.txt ]; then
            bash .github/scripts/notify-slack.sh "$(cat /tmp/slack-notify.txt)"
            rm -f /tmp/slack-notify.txt
          fi
